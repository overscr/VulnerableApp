spring.datasource.admin.username=admin
spring.datasource.admin.password=hacker

spring.datasource.application.username=application
spring.datasource.application.password=hacker

# The H2 console gives whoever can reach it an interactive, unauthenticated SQL client against
# every table in this datasource - including the credential and vault tables the application
# itself works hard to protect behind hashing/encryption. Serving it at all, and in particular
# allowing non-localhost callers to reach it, turns every other storage-layer fix in this app into
# a bypassable speed bump. It stays off in every profile.
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

vulnerableapp.email.base-url=http://localhost
